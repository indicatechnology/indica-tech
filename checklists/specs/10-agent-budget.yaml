# Page spec for comment keyword BUDGET on 343 (the introductory-price News Take). Checklist text written 2026-10-16 as the
# lead magnet reference/lead-magnets/BUDGET-model-price-cliff-2026-10.yaml; sources added, three "why" lines lengthened with
# published figures, and every number re-checked 2026-10-19. Body names no company (NG's rule, 30 Sep 2026).
id: agent-budget
slug: agent-budget
cta_word: BUDGET
title: Agent budget checklist
subtitle: A launch price that doubles on 1 December 2026, and the five numbers to set before it does
kicker: "@demotoprod · BUDGET"
date: October 2026
why_label: "Why."
compact: true
pdf: BUDGET-model-price-cliff-2026-10.pdf
out: reference/lead-magnets/BUDGET-model-price-cliff-2026-10.pdf
intro: >
  A frontier model went on sale on 13 October 2026 at two dollars per million input tokens and ten per million output,
  for seven weeks. From 1 December the same tokens cost four and twenty. Output is five times input and includes the
  reasoning nobody reads. A pilot priced on the launch rate meets a December invoice at twice the price. Five checks.
checks:
  - title: Budget at the list price
    why: "The discount has an end date; the budget line does not. A cost model built on the launch rate is wrong by a factor of two from the first of December."
    do:
      - Put the list price in the cost model today, with the discount's end date on the ticket that owns the line.
      - Set the spend alert at the list price now, so the alarm is tested while the bill is still small.
    code: |
      price_per_million: {input: 4.00, output: 20.00, cached: 0.20}   # list price
      alert_usd_per_day: 120   # list-price projection, from today
    sources:
      - label: "trade-press report of the launch pricing, 13 Oct 2026"
        url: https://venturebeat.com/technology/google-makes-gemini-4-argon-broadly-available-with-limited-time-low-api-pricing-of-2-10-per-1m-token
  - title: An output ceiling per route
    why: "Agents are output machines, and output costs five times input. A request cap written when the ceiling was sixty-four thousand tokens does nothing against a million-token task."
    do:
      - Size max output tokens to the job, per route, and log every request that hits the ceiling.
      - A million-token task is a batch job with its own approval, at half the standard rate.
      - Count ceiling hits every day; a rising count is a prompt problem before it is a budget problem.
    code: |
      routes: {support-answer: {max_output_tokens: 4000}, code-migration: {max_output_tokens: 64000, tier: batch}}
    sources:
      - label: "trade-press report of the launch pricing, 13 Oct 2026 (the 64,000-token ceiling raised to a million)"
        url: https://venturebeat.com/technology/google-makes-gemini-4-argon-broadly-available-with-limited-time-low-api-pricing-of-2-10-per-1m-token
      - label: "the full price table, 14 Oct 2026 (batch at half the standard rate)"
        url: https://dev.to/paullovelace/gemini-4-argons-210-api-pricing-doubles-december-1-full-price-table-2k02
  - title: Cache hit rate on the dashboard
    why: "Cached input is ninety-five percent off: at the list price, twenty cents per million against four dollars. The order of the prompt decides the bill more than the model does."
    do:
      - "Stable content first: system prompt, tool schemas, reference documents; the user's turn last."
      - Put the cache hit rate per route next to latency and error rate; a falling rate pages someone before the invoice does.
      - Treat a prompt change that breaks the cache as a cost regression in review.
    code: |
      cache_hit_rate{route="support-answer"} < 0.8 for 30m   # page: prefix changed
    sources:
      - label: "the full price table, 14 Oct 2026 (cached input $0.10 now, $0.20 from 1 December)"
        url: https://dev.to/paullovelace/gemini-4-argons-210-api-pricing-doubles-december-1-full-price-table-2k02
  - title: Thinking tokens are output
    why: "The output rate includes the model's reasoning; the published price table says so in as many words. The answer on screen is a fraction of what was billed."
    do:
      - Log output tokens per task, split into visible answer and reasoning, and watch the ratio per route.
      - Set the reasoning effort per route; the cheapest setting that passes the eval is the default.
    sources:
      - label: "the full price table, 14 Oct 2026 (output prices include thinking tokens)"
        url: https://dev.to/paullovelace/gemini-4-argons-210-api-pricing-doubles-december-1-full-price-table-2k02
  - title: Rehearse 1 December
    why: "A price step with a known date is the easiest incident to prepare for. The launch rate runs to 30 November 2026 and the list rate applies from 1 December; both dates were published on launch day."
    do:
      - Run one day of traffic through the cost model at the list price, compare it with the alert thresholds, and name who approves the line after the step.
    sources:
      - label: "trade-press report of the launch pricing, 13 Oct 2026"
        url: https://venturebeat.com/technology/google-makes-gemini-4-argon-broadly-available-with-limited-time-low-api-pricing-of-2-10-per-1m-token
      - label: "the vendor's launch post, 13 Oct 2026"
        url: https://blog.google/innovation-and-ai/technology/developers-tools/build-with-gemini-4-argon/
notes: >
  Prices are the vendor's published standard tier: $2 input / $10 output per million tokens to 30 November 2026, $4 / $20
  from 1 December, cached input at 95 percent off, batch at half the standard rate. The thresholds in the code blocks are
  illustrative; set yours from your own traffic.
footer: "Source: a frontier model vendor's published API price list of 13 October 2026 ($2 / $10 per million to 30 November; $4 / $20 from 1 December; cached input 95% off). Illustrative thresholds; set yours from your own traffic. @demotoprod"
